name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  ci-gates:
    name: CI Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mud
          POSTGRES_USER: mud
          POSTGRES_PASSWORD: mudpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for PostgreSQL
        run: node tools/wait_for_postgres.mjs
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Prisma migrate deploy
        run: pnpm --filter server prisma migrate deploy
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Prisma seed
        run: pnpm --filter server prisma db seed
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Content validation
        run: pnpm content:validate

      - name: Catalog sync
        run: pnpm catalog:sync

      - name: Check catalog diff (must be 0)
        run: |
          if git diff --exit-code; then
            echo "✅ Catalog sync: no diff"
          else
            echo "❌ Catalog sync produced diff. Run 'pnpm catalog:sync' locally and commit."
            exit 1
          fi

      - name: Smoke test
        run: pnpm --filter server smoke
        env:
          TEST_MODE: "true"
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud
          REDIS_URL: redis://localhost:6379

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Flutter pub get
        run: cd mud_client && flutter pub get

      - name: Flutter analyze
        run: cd mud_client && flutter analyze

  ci-gates-result:
    name: CI Gates Result
    runs-on: ubuntu-latest
    needs: ci-gates
    if: always()
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.ci-gates.result }}" == "success" ]; then
            echo "✅ All CI gates passed!"
            exit 0
          else
            echo "❌ CI gates failed. Check logs above."
            exit 1
          fi

