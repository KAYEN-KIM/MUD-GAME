name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  ci-gates:
    name: CI Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mud
          POSTGRES_USER: mud
          POSTGRES_PASSWORD: mudpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mud"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "⚠️ frozen-lockfile failed, trying without it..."
            pnpm install --no-frozen-lockfile
          fi

      - name: Generate Prisma Client
        working-directory: apps/server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Wait for PostgreSQL
        run: node tools/wait_for_postgres.mjs
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Prisma migrate deploy
        working-directory: apps/server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Prisma seed
        working-directory: apps/server
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud

      - name: Content validation
        run: pnpm content:validate

      - name: Catalog sync
        run: pnpm catalog:sync

      - name: Check catalog diff (must be 0)
        run: |
          # 타임스탬프 필드(createdAt)를 제외하고 diff 확인
          if git diff --exit-code --ignore-all-space --ignore-blank-lines mud_client/assets/catalog/items_catalog.json | grep -v "createdAt" | grep -q "^[+-]"; then
            echo "❌ Catalog sync produced diff (excluding createdAt). Run 'pnpm catalog:sync' locally and commit."
            git diff mud_client/assets/catalog/items_catalog.json
            exit 1
          else
            echo "✅ Catalog sync: no diff (or only createdAt changed)"
          fi

      - name: Build server
        working-directory: apps/server
        run: pnpm build
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud
          REDIS_URL: redis://localhost:6379

      - name: Start server in background
        working-directory: apps/server
        run: |
          pnpm start &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Waiting for server to start..."
          sleep 5
          for i in {1..30}; do
            if curl -f http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            echo "⏳ Waiting for server... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci
          ADMIN_KEY: test-admin-key-for-ci
          TEST_MODE: "true"
          MAX_UNLOCKED_SEASON: "99"

      - name: Smoke test
        run: pnpm --filter server smoke
        env:
          TEST_MODE: "true"
          DATABASE_URL: postgresql://mud:mudpass@localhost:5432/mud
          REDIS_URL: redis://localhost:6379

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
          pkill -f "node.*dist/main" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Flutter pub get
        run: cd mud_client && flutter pub get

      - name: Flutter analyze
        run: cd mud_client && flutter analyze

  ci-gates-result:
    name: CI Gates Result
    runs-on: ubuntu-latest
    needs: ci-gates
    if: always()
    steps:
      - name: Check CI result
        run: |
          if [ "${{ needs.ci-gates.result }}" == "success" ]; then
            echo "✅ All CI gates passed!"
            exit 0
          else
            echo "❌ CI gates failed. Check logs above."
            exit 1
          fi

