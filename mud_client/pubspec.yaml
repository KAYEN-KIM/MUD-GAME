name: mud_client
description: MUD 게임 Flutter 클라이언트
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  http: ^1.1.0
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Network Info
  network_info_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/catalog/items_catalog.json

