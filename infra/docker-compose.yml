services:
  postgres:
    image: postgres:16-alpine
    container_name: mud-postgres
    environment:
      POSTGRES_DB: mud
      POSTGRES_USER: mud
      POSTGRES_PASSWORD: mudpass
    ports:
      - "15432:5432"  # 외부 포트를 15432로 변경 (Windows 포트 예약 문제 회피)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mud"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mud-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

